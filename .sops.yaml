# SOPS recipient config for the bootstrap repo. Two delivery-agnostic
# key tiers (matching the dotfiles .sops.yaml anchors of the same names):
#   bootstrap_privileged — real-device bootstraps. Private half in
#     1Password; also a recipient of the dotfiles fleet secrets.
#   bootstrap_sandbox — CI and e2e/sandbox VMs (the Jenkins
#     bootstrap-age-key credential / test fixtures); never a recipient of
#     privileged dotfiles secrets.
#
# Two files, two recipient sets:
#   secrets.yaml — both tiers. The bot GitHub token (registry clone at
#     flash, https clone and push of dotfiles for sandbox hosts), the LUKS
#     passphrase and the attic token.
#   secrets-privileged.yaml — the privileged tier ONLY. The jacobbrugh-owned
#     token the ssh phase uploads a privileged host's SSH key with (fine-
#     grained PAT, "Git SSH keys: Read and write" and nothing else). CI
#     cannot decrypt it, and `sops updatekeys` for it runs on an operator
#     machine, never in the UPDATEKEYS CI stage.
keys:
    - &bootstrap_sandbox 
    - &bootstrap_privileged 

creation_rules:
    - path_regex: '^secrets\.yaml$'
      key_groups:
          - age:
                - *bootstrap_sandbox
                - *bootstrap_privileged
    - path_regex: '^secrets-privileged\.yaml$'
      key_groups:
          - age:
                - *bootstrap_privileged
